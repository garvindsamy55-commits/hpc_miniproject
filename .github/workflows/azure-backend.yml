name: Azure Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/azure-backend.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        run: |
          cd backend
          pytest -v

      # Optional: Deploy to Azure App Service when AZURE_WEBAPP_PUBLISH_PROFILE is configured
      - name: Deploy to Azure Web App
        if: github.ref == 'refs/heads/main' && env.AZURE_PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v3
        env:
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        with:
          app-name: "cloudburst-backend"
          package: "./backend"
